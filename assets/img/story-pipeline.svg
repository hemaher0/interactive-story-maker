<text x="1155" y="289" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="21" font-weight="700" fill="#24292f">Scene</text>
<text x="1155" y="317" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#24292f">응답 이미지 표시</text>
<text x="30" y="384" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" font-weight="400" fill="#57606a">흰색: 브라우저의 데이터·화면 처리     보라색: 외부 Gemini API 호출</text>
