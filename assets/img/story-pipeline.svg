<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="420" viewBox="0 0 1380 420" role="img" aria-labelledby="title desc">
<title id="title">Two paths: story element generation and scene visualization</title>
<desc id="desc">A description and type are sent to Gemini to generate JSON elements. These join the built-in examples in Assets, and users place them on the canvas. Visualize Scene converts the canvas into a snapshot, SceneSpec, and image prompt, then requests an image and displays it in Scene.</desc>
