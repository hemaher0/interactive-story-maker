<text x="685" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#24292f">Built-in + generated elements</text>
<rect x="1010" y="64" width="335" height="82" rx="8" fill="#fff" stroke="#c9d3dd"/>
<text x="1025" y="97" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#24292f">Block Canvas</text>
<text x="1025" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#24292f">Place · connect · edit rules</text>
