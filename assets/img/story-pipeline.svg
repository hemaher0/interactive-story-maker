<text x="45" y="97" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#24292f">Type + description</text>
<text x="45" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#24292f">Natural-language input</text>
<rect x="350" y="64" width="265" height="82" rx="8" fill="#f2ecff" stroke="#ae95d5"/>
<text x="365" y="97" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#563b86">Element generation</text>
<text x="365" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#563b86">Gemini · JSON response</text>
